name: Selfhost Windows Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Pub cache sur le MÊME disque (D:) que le workspace : les .plugin_symlinks deviennent
    # same-drive, ce qui répare la résolution de symlinks de cargokit (super_native_extensions)
    # et autres plugins natifs qui cassent sur des symlinks cross-drive (C: -> D:).
    env:
      PUB_CACHE: D:\pubcache
      # MSVC récent (VS 18) transforme <experimental/coroutine> (utilisé par
      # flutter_inappwebview_windows, permission_handler_windows) en erreur dure.
      # La variable CL injecte ce define dans toutes les compilations cl.exe.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync submodules
        run: git submodule update --init --recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Strip Firebase deps (OSS)
        run: dart run tool/strip_firebase_deps.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      # flutter_webrtc downloads libwebrtc.zip then file(ARCHIVE_EXTRACT) it; CMake >=3.31
      # refuses to extract through the plugin symlink. Its CMakeLists skips extraction if
      # third_party/libwebrtc already exists. So: 1st build downloads the zip (fails on
      # extract), we extract it ourselves (PowerShell has no symlink restriction), 2nd
      # build then skips the CMake extract and proceeds.
      - name: Build Windows (1st pass - fetches libwebrtc.zip, extract fails)
        continue-on-error: true
        run: >
          flutter build windows --release
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - name: Pre-extract libwebrtc (bypass CMake symlink-extract block)
        shell: pwsh
        run: |
          $base = Join-Path $env:PUB_CACHE "hosted\pub.dev"
          $plugin = Get-ChildItem $base -Directory -Filter "flutter_webrtc-*" | Select-Object -First 1
          if (-not $plugin) { throw "flutter_webrtc plugin dir not found under $base" }
          $tp = Join-Path $plugin.FullName "third_party"
          $zip = Join-Path $tp "downloads\libwebrtc.zip"
          Write-Host "third_party = $tp"
          if (-not (Test-Path $zip)) { throw "libwebrtc.zip not found at $zip" }
          if (-not (Test-Path (Join-Path $tp "libwebrtc"))) {
            Write-Host "Extracting libwebrtc.zip ..."
            Expand-Archive -Path $zip -DestinationPath $tp -Force
          } else {
            Write-Host "libwebrtc already present, nothing to do"
          }
          Get-ChildItem $tp | Select-Object Name | Format-Table -AutoSize
      - name: Build Windows (2nd pass - self-hosted -> fluxer.amiand.fr)
        run: >
          flutter build windows --release
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - name: Package
        shell: pwsh
        run: |
          $src = (Resolve-Path "build\windows\x64\runner\Release").Path
          Write-Host "=== Contenu du bundle Release ==="
          Get-ChildItem $src -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          # Compress-Archive -Path dir/* rate des fichiers ; .NET CreateFromDirectory zippe
          # tout le dossier de façon fiable et récursive.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, "$PWD\fluxer-windows-x64.zip")
          Write-Host "Zip: $((Get-Item fluxer-windows-x64.zip).Length) octets"
      - uses: actions/upload-artifact@v4
        with:
          name: fluxer-windows-x64
          path: fluxer-windows-x64.zip
          if-no-files-found: error
