name: Selfhost Windows Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync submodules
        run: git submodule update --init --recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Strip Firebase deps (OSS)
        run: dart run tool/strip_firebase_deps.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows (self-hosted -> fluxer.amiand.fr)
        run: >
          flutter build windows --release
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fluxer-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fluxer-windows-x64
          path: fluxer-windows-x64.zip
          if-no-files-found: error
