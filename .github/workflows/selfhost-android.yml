name: Selfhost Android (OSS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync submodules
        run: git submodule update --init --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Strip Firebase deps (OSS)
        run: dart run tool/strip_firebase_deps.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (self-hosted -> fluxer.amiand.fr)
        run: >
          flutter build apk --release
          --flavor stableUnifiedpush
          --build-number 1
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: fluxer-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
