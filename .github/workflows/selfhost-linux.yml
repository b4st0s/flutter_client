name: Selfhost Linux Desktop

on:
  workflow_dispatch:

jobs:
  build:
    # 22.04 : libwpewebkit-1.0-dev existe (renommé sur 24.04) + glibc plus ancienne
    # = binaire plus portable pour la distribution.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync submodules
        run: git submodule update --init --recursive
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          # libunwind-dev pose souci en résolution transitive sur les runners 22.04 :
          # on l'installe d'abord explicitement (avec libunwind8 pour aligner les versions),
          # et on diagnostique si ça coince.
          sudo apt-get install -y libunwind-8 libunwind-dev \
            || sudo apt-get install -y libunwind-dev \
            || { echo "=== DIAG libunwind ==="; apt-cache policy libunwind-dev libunwind8 libunwind-8; }
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev \
            libmpv-dev mpv libsecret-1-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Strip Firebase deps (OSS)
        run: dart run tool/strip_firebase_deps.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux (self-hosted -> fluxer.amiand.fr)
        # Un plugin natif (flutter_webrtc) passe -Wno-deprecated-literal-operator,
        # inconnu de clang-14 (22.04) -> -Werror le rend fatal. On désactive l'erreur
        # sur flags inconnus (indépendant de la version de compilateur).
        env:
          CXXFLAGS: "-Wno-unknown-warning-option"
          CFLAGS: "-Wno-unknown-warning-option"
        run: >
          flutter build linux --release
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/fluxer-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: fluxer-linux-x64
          path: fluxer-linux-x64.tar.gz
          if-no-files-found: error
