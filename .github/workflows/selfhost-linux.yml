name: Selfhost Linux Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sync submodules
        run: git submodule update --init --recursive
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Strip Firebase deps (OSS)
        run: dart run tool/strip_firebase_deps.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux (self-hosted -> fluxer.amiand.fr)
        run: >
          flutter build linux --release
          --dart-define=APP_ENVIRONMENT=stable
          --dart-define=PUSH_PROVIDER=unifiedpush
          --dart-define=FLUXER_BASE_URL=https://fluxer.amiand.fr/api/v1
      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/fluxer-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: fluxer-linux-x64
          path: fluxer-linux-x64.tar.gz
          if-no-files-found: error
